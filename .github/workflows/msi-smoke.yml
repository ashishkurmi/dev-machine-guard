name: MSI Smoke Test

# Runs the full Windows MSI flow (build → install → verify → bootstrap run +
# SYSTEM update tick → repair → N→N+1 upgrade → uninstall) on a fresh
# windows-latest runner. Catches breakage in the WiX manifest,
# the deferred-CA wiring, the configure --non-interactive path, or the
# icacls hardening — all of which only surface on a real install.
#
# Path-filtered so it doesn't run on doc-only PRs. The merge_group event has no
# paths filter, so every merge-queue entry runs the full flow regardless.

on:
  pull_request:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/windows/**'
      - 'Makefile'
      - '.github/workflows/msi-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/windows/**'
      - 'Makefile'
      - '.github/workflows/msi-smoke.yml'
  # Merge queue: GitHub builds a temporary gh-readonly-queue/main/* branch with
  # the PR merged onto current main and runs checks there. Without this trigger
  # nothing is reported on that commit and the queue entry fails.
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  # One run per PR: a new push supersedes the in-flight run. Merge-queue and
  # main runs key on their unique ref and are never cancelled, since cancelling
  # a queue run fails the queue entry.
  group: msi-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  msi-smoke:
    name: Build, install, verify, repair, upgrade, uninstall
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@58077d3c7e43986b6b15fba718e8ea69e387dfcc # v2.15.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Install WiX 4 + Util extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix --version
          wix extension add --global WixToolset.Util.wixext/4.0.5

      - name: Build Windows .exes (agent + launcher)
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" `
            -o "$PWD\dmg-smoke.exe" `
            ./cmd/stepsecurity-dev-machine-guard
          go build -trimpath -ldflags "-s -w -H windowsgui" `
            -o "$PWD\dmg-smoke-task.exe" `
            ./cmd/stepsecurity-dev-machine-guard-task
          # The MSI's third component: the Linux build of the same agent, which
          # a Windows host runs inside its WSL distributions over /mnt/c.
          # CGO_ENABLED stays 0 (set above) because a glibc-linked binary fails
          # on a musl distro such as Alpine.
          $env:GOOS = "linux"
          go build -trimpath -ldflags "-s -w" `
            -o "$PWD\dmg-smoke-linux" `
            ./cmd/stepsecurity-dev-machine-guard
          $env:GOOS = "windows"
          Get-Item "$PWD\dmg-smoke.exe", "$PWD\dmg-smoke-task.exe", "$PWD\dmg-smoke-linux" |
            Select-Object Name, Length

      - name: Build MSI
        shell: pwsh
        run: |
          # Read Version from internal/buildinfo/version.go so the MSI
          # Package Version matches what the binary reports.
          $vline = Select-String -Path internal/buildinfo/version.go `
            -Pattern 'Version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = $vline.Matches[0].Groups[1].Value
          Write-Host "Building MSI with Package Version: $version"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          wix build packaging/windows/Product.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d Arch=x64 `
            -d "Version=$version" `
            -d "BinaryPath=$PWD\dmg-smoke.exe" `
            -d "LauncherPath=$PWD\dmg-smoke-task.exe" `
            -d "LinuxBinaryPath=$PWD\dmg-smoke-linux" `
            -out "dist\dmg-smoke.msi"
          Get-Item "dist\dmg-smoke.msi" | Select-Object Name, Length

          # N+1: the same payload under the next patch version, for the
          # major-upgrade path (seed\<N+1>, no downgrade of a newer current).
          $p = $version.Split('.')
          $next = "$($p[0]).$($p[1]).$([int]$p[2] + 1)"
          wix build packaging/windows/Product.wxs `
            -arch x64 `
            -ext WixToolset.Util.wixext `
            -d Arch=x64 `
            -d "Version=$next" `
            -d "BinaryPath=$PWD\dmg-smoke.exe" `
            -d "LauncherPath=$PWD\dmg-smoke-task.exe" `
            -d "LinuxBinaryPath=$PWD\dmg-smoke-linux" `
            -out "dist\dmg-smoke-next.msi"
          "MSI_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "MSI_NEXT_VERSION=$next" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLED_MSI=dist\dmg-smoke.msi" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install MSI with synthetic tenant config
        shell: pwsh
        run: |
          # Synthetic config: real-looking values but pointed at an
          # invalid endpoint. The MSI's install CA passes
          # --ignore-telemetry-error so initial telemetry POST failure
          # doesn't roll back the install. Exit 0 expected.
          $p = Start-Process -FilePath "msiexec.exe" -ArgumentList @(
            "/i", "dist\dmg-smoke.msi", "/qn", "/norestart",
            "CUSTOMERID=ci-smoke",
            "APIENDPOINT=https://api.invalid.example",
            "APIKEY=ci-test-fake-api-key",
            "SCANFREQUENCY=4",
            "AUTOUPDATE=0",
            "/l*v", "dist\dmg-install.log"
          ) -Wait -PassThru
          Write-Host "msiexec exit: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) {
            Write-Host "::error::msiexec install failed with exit $($p.ExitCode)"
            Write-Host "--- last 80 lines of install log ---"
            Get-Content dist\dmg-install.log -Tail 80
            exit 1
          }

      - name: Write assertion helpers
        shell: pwsh
        run: |
          # Shared by the verify steps below (dot-sourced).
          @'
          $script:fail = $false
          $root   = "C:\Program Files\StepSecurity"
          $boot   = "$root\stepsecurity-dev-machine-guard-bootstrap.exe"
          $data   = "C:\ProgramData\StepSecurity"
          $tasks  = @("StepSecurity Dev Machine Guard", "StepSecurity Dev Machine Guard (Logon)", "StepSecurity Dev Machine Guard (Update)")
          function Check($ok, $msg) {
            if ($ok) { Write-Host "[OK] $msg" } else { Write-Host "::error::$msg"; $script:fail = $true }
          }
          function Done { if ($script:fail) { exit 1 }; exit 0 }
          function State { Get-Content "$root\state\state.json" -Raw | ConvertFrom-Json }
          function TaskXml($name) { [xml](schtasks /query /tn $name /xml | Out-String) }
          function UsableDir($d) { (Test-Path "$d\stepsecurity-dev-machine-guard.exe") -and (Test-Path "$d\stepsecurity-dev-machine-guard-task.exe") -and (Test-Path "$d\dmg-linux") }
          function Msi($argList, $log) {
            # Wait for msiexec itself only (not descendants), bounded, and dump
            # the log tail plus any DMG processes when it doesn't finish.
            # /norestart: a reboot-required result must fail the step, not
            # restart the runner (which wedges the job with no logs).
            $p = Start-Process -FilePath "msiexec.exe" -ArgumentList ($argList + @("/norestart", "/l*v", $log)) -PassThru
            if (-not $p.WaitForExit(300000)) {
              Write-Host "::error::msiexec $($argList -join ' ') still running after 5 min"
              Get-Process | Where-Object { $_.Path -and ($_.Path -like "$root\*" -or $_.Name -like 'msiexec*') } | Format-Table Id, Name, Path -AutoSize | Out-String | Write-Host
              Get-Content $log -Tail 120 -ErrorAction SilentlyContinue | Out-Host
              $p.Kill(); return -1
            }
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80 -ErrorAction SilentlyContinue | Out-Host }
            return $p.ExitCode
          }
          function DmgProcesses { Get-Process | Where-Object { $_.Path -and $_.Path -like "$root\*" } | Format-Table Id, Name, Path -AutoSize | Out-String | Write-Host }
          function AssertTasks {
            foreach ($t in $tasks) {
              schtasks /query /tn $t 2>&1 | Out-Null
              Check ($LASTEXITCODE -eq 0) "task registered: $t"
            }
            foreach ($t in $tasks[0..1]) {
              $x = TaskXml $t
              $exec = $x.Task.Actions.Exec
              Check ($exec.Command.Trim('"') -eq $boot) "$t action runs the bootstrap ($($exec.Command))"
              Check ($exec.Arguments -match '^run send-telemetry --install-dir=') "$t arguments: $($exec.Arguments)"
              Check ($x.Task.Principals.Principal.GroupId -eq 'S-1-5-4' -or $x.Task.Principals.Principal.UserId -eq 'S-1-5-4') "$t principal is INTERACTIVE"
            }
            $u = TaskXml $tasks[2]
            $exec = $u.Task.Actions.Exec
            Check ($exec.Command.Trim('"') -eq $boot -and $exec.Arguments -eq 'update') "update task action: $($exec.Command) $($exec.Arguments)"
            $uid = $u.Task.Principals.Principal.UserId
            Check ($uid -eq 'S-1-5-18' -or $uid -match 'SYSTEM') "update task principal SYSTEM ($uid)"
            $st = $u.Task.Settings
            Check ($st.MultipleInstancesPolicy -eq 'IgnoreNew') "update task IgnoreNew"
            Check ($st.ExecutionTimeLimit -eq 'PT30M') "update task ExecutionTimeLimit PT30M"
            Check ($st.StartWhenAvailable -eq 'true') "update task StartWhenAvailable"
            Check ($st.DisallowStartIfOnBatteries -eq 'false' -and $st.StopIfGoingOnBatteries -eq 'false') "update task runs on battery"
            Check ($u.Task.Triggers.TimeTrigger.Repetition.Interval -eq 'PT1H' -and $u.Task.Triggers.TimeTrigger.RandomDelay -eq 'PT10M') "update task hourly + 10 min random delay"
            Check ($u.Task.Triggers.BootTrigger.Delay -eq 'PT15M') "update task at boot + 15 min"
          }
          function AssertProtected($dir) {
            # Exact: protected DACL, owner SYSTEM, and exactly these three
            # explicit ACEs. Any extra ACE (e.g. Users:Modify) fails (R-B-3).
            $acl = Get-Acl $dir
            Check ($acl.Owner -eq 'NT AUTHORITY\SYSTEM') "$dir owner SYSTEM ($($acl.Owner))"
            Check $acl.AreAccessRulesProtected "$dir DACL protected (inheritance off)"
            $got = @($acl.Access | ForEach-Object {
              "$($_.AccessControlType)|$($_.IdentityReference)|$($_.FileSystemRights)|$($_.InheritanceFlags)|$($_.IsInherited)"
            } | Sort-Object)
            $want = @(
              'Allow|BUILTIN\Administrators|FullControl|ContainerInherit, ObjectInherit|False',
              'Allow|BUILTIN\Users|ReadAndExecute, Synchronize|ContainerInherit, ObjectInherit|False',
              'Allow|NT AUTHORITY\SYSTEM|FullControl|ContainerInherit, ObjectInherit|False'
            ) | Sort-Object
            Check (($got -join "`n") -eq ($want -join "`n")) "$dir DACL is exactly SYSTEM F, Administrators F, Users RX:`n  got: $($got -join '; ')"
          }
          '@ | Set-Content -Path "$env:RUNNER_TEMP\dmg-assert.ps1"

      - name: Verify install artifacts
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\dmg-assert.ps1"
          $ver  = $env:MSI_VERSION
          $seed = "$root\seed\$ver"
          $cfg  = "$data\config.json"

          # 1. Layout: bootstrap + seed; the legacy top-level agent/launcher are gone.
          Check (Test-Path $boot) "bootstrap present"
          Check (UsableDir $seed) "seed\$ver has the agent, launcher and dmg-linux"
          Check (-not (Test-Path "$root\stepsecurity-dev-machine-guard.exe")) "no top-level agent"
          Check (-not (Test-Path "$root\stepsecurity-dev-machine-guard-task.exe")) "no top-level launcher"

          # 1b. dmg-linux must sit beside agent.exe (the WSL scan phase looks next
          # to its own executable) and be a 64-bit x86-64 ELF.
          $hdr = [byte[]]::new(20)
          $fs = [System.IO.File]::OpenRead("$seed\dmg-linux")
          try { $null = $fs.Read($hdr, 0, 20) } finally { $fs.Dispose() }
          $machine = $hdr[18] + ($hdr[19] -shl 8)
          Check ($hdr[0] -eq 0x7F -and $hdr[1] -eq 0x45 -and $hdr[2] -eq 0x4C -and $hdr[3] -eq 0x46 -and $hdr[4] -eq 2 -and $machine -eq 0x3E) "dmg-linux is a 64-bit x86-64 ELF"

          # 2. adopt-seed: versions\<ver> copied, state.json current = seed,
          # versions\ and state\ protected.
          Check ((UsableDir "$root\versions\$ver") -and (Test-Path "$root\versions\$ver\manifest.json")) "versions\$ver adopted from the seed, with manifest"
          $state = State
          Check ($state.schema -eq 1 -and $state.current -eq $ver) "state.json current = $ver (got $($state.current))"
          AssertProtected "$root\versions"
          AssertProtected "$root\state"

          # 3. AgentVersion (Intune detection) = MSI version; no RunningVersion yet.
          $av = (Get-ItemProperty -Path 'HKLM:\Software\StepSecurity' -Name AgentVersion -ErrorAction SilentlyContinue).AgentVersion
          Check ($av -eq $ver) "AgentVersion = $ver ($av)"

          # 4. Machine-wide config with our values; installed with AUTOUPDATE=0.
          $content = Get-Content $cfg -Raw
          Check ($content -match '"customer_id"\s*:\s*"ci-smoke"' -and $content -match '"api_key"\s*:\s*"ci-test-fake-api-key"') "config written with expected values"
          Check ($content -match '"auto_update"\s*:\s*false') "AUTOUPDATE=0 wrote auto_update false"

          # 5. config.json ACL hardening: Users R, Admins + SYSTEM F.
          $acl = & icacls $cfg | Out-String
          Check ($acl -match 'BUILTIN\\Users:\(R\)' -and $acl -match 'BUILTIN\\Administrators:\(F\)' -and $acl -match 'NT AUTHORITY\\SYSTEM:\(F\)') "config.json ACL hardened"

          # 6. All three tasks, actions through the bootstrap.
          AssertTasks
          Done

      - name: Bootstrap run and SYSTEM update tick
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\dmg-assert.ps1"
          $ver = $env:MSI_VERSION

          # run: the bootstrap resolves current and launches versions\<v>\task.exe
          # (GUI subsystem, hence Start-Process -Wait) and records the run.
          $p = Start-Process -FilePath $boot -ArgumentList @("run", "version", "--install-dir=$data") -Wait -PassThru
          Check ($p.ExitCode -eq 0) "bootstrap run exit 0 ($($p.ExitCode))"
          $runs = Get-Content "$data\runs\$ver.json" -Raw | ConvertFrom-Json
          $last = $runs.records[-1]
          Check ($last.version -eq $ver -and $last.exit_code -eq 0) "run record finalized: $($runs | ConvertTo-Json -Compress)"

          # update: fire the real SYSTEM task and wait for it to finish. Until the
          # agent ships self-update the agent exits non-zero; either way the
          # bootstrap records the updater result in state.json as SYSTEM.
          schtasks /run /tn $tasks[2] | Out-Null
          $deadline = (Get-Date).AddMinutes(4)
          do {
            Start-Sleep -Seconds 3
            $info = Get-ScheduledTask -TaskName $tasks[2] | Get-ScheduledTaskInfo
            $state = (Get-ScheduledTask -TaskName $tasks[2]).State
          } while (($state -eq 'Running' -or $info.LastRunTime -lt (Get-Date).AddYears(-1)) -and (Get-Date) -lt $deadline)
          Write-Host "update task: state=$state LastTaskResult=$($info.LastTaskResult)"
          Check ($state -ne 'Running') "update task finished"
          $s = State
          Check ($s.updater.version -eq $ver) "state.updater recorded by the bootstrap: $($s.updater | ConvertTo-Json -Compress)"
          Get-Content "$root\state\update.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          DmgProcesses
          Done

      - name: Repair keeps current and restores tasks (M-7)
        timeout-minutes: 8
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\dmg-assert.ps1"
          $ver = $env:MSI_VERSION

          # Simulate a self-updated device: a newer versions\ dir as current.
          Copy-Item -Recurse "$root\versions\$ver" "$root\versions\99.0.0"
          $s = State
          $s.current = "99.0.0"; $s.previous = $ver
          $s | ConvertTo-Json -Depth 10 | Set-Content -Path "$root\state\state.json" -Encoding utf8NoBOM
          # And a deleted scan task, which the repair must restore.
          schtasks /delete /tn $tasks[0] /f | Out-Null

          # msiexec /f ignores public properties, so the repair that also sets
          # AUTOUPDATE=1 is a reinstall: /i with REINSTALL=ALL ('a' = all files, like /fa).
          $code = Msi @("/i", $env:INSTALLED_MSI, "/qn", "REINSTALL=ALL", "REINSTALLMODE=amus", "AUTOUPDATE=1") "dist\dmg-repair.log"
          Check ($code -eq 0) "repair (REINSTALL=ALL) exit 0 ($code)"
          Check ((Get-Content "$data\config.json" -Raw) -match '"auto_update"\s*:\s*true') "repair with AUTOUPDATE=1 re-enabled auto_update"
          $s = State
          Check ($s.current -eq "99.0.0" -and $s.previous -eq $ver) "repair kept current 99.0.0 (got $($s.current)/$($s.previous))"
          AssertTasks
          Done

      - name: Major upgrade N to N+1 keeps tasks and never downgrades
        timeout-minutes: 8
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\dmg-assert.ps1"
          $next = $env:MSI_NEXT_VERSION
          $code = Msi @("/i", "dist\dmg-smoke-next.msi", "/qn") "dist\dmg-upgrade.log"
          Check ($code -eq 0) "upgrade msiexec exit 0 ($code)"
          Check ((Get-Content "$data\config.json" -Raw) -match '"auto_update"\s*:\s*true') "upgrade without AUTOUPDATE left auto_update unchanged (true)"
          if ($code -eq 0) {
            "INSTALLED_MSI=dist\dmg-smoke-next.msi" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }
          Check (UsableDir "$root\seed\$next") "seed\$next installed"
          Check (-not (Test-Path "$root\seed\$env:MSI_VERSION")) "old seed removed"
          Check (UsableDir "$root\versions\$next") "versions\$next adopted"
          $s = State
          Check ($s.current -eq "99.0.0") "seed $next < current 99.0.0: no downgrade (got $($s.current))"
          $av = (Get-ItemProperty -Path 'HKLM:\Software\StepSecurity' -Name AgentVersion).AgentVersion
          Check ($av -eq $next) "AgentVersion = $next ($av)"
          # The old product's uninstall CA is skipped on upgrade (M-6).
          $ranUninstall = Select-String -Path "dist\dmg-upgrade.log" -Pattern 'Doing action: RunUninstallScheduledTask' -SimpleMatch -Quiet
          Check (-not $ranUninstall) "old uninstall CA not run during the upgrade"
          AssertTasks
          Done

      - name: Uninstall MSI
        if: always()
        timeout-minutes: 8
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\dmg-assert.ps1"
          $msi = $env:INSTALLED_MSI
          if ($msi -and (Test-Path $msi)) {
            $code = Msi @("/x", $msi, "/qn") "dist\dmg-uninstall.log"
            Write-Host "msiexec /x $msi exit: $code"
            if ($code -ne 0) { exit 1 }
          }

      - name: Verify uninstall cleanup
        shell: pwsh
        run: |
          . "$env:RUNNER_TEMP\dmg-assert.ps1"
          foreach ($leftover in @($boot, "$root\seed", "$root\versions", "$root\state")) {
            Check (-not (Test-Path $leftover)) "removed: $leftover"
          }
          foreach ($t in $tasks) {
            schtasks /query /tn $t 2>&1 | Out-Null
            Check ($LASTEXITCODE -ne 0) "task removed: $t"
          }
          $reg = Get-ItemProperty -Path 'HKLM:\Software\StepSecurity' -ErrorAction SilentlyContinue
          Check (-not $reg.RunningVersion) "RunningVersion removed"
          Check (-not $reg.AgentVersion) "AgentVersion removed"
          $procs = Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith("$root\", [StringComparison]::OrdinalIgnoreCase) }
          Check (-not $procs) "no DMG processes left running"

          # Note: C:\ProgramData\StepSecurity\config.json intentionally persists
          # across uninstall — it's tenant config, not MSI-managed payload (M-8
          # is out of scope). This mirrors docs/deploying-via-sccm.md.
          Done

      - name: Upload install logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: msi-smoke-logs
          path: |
            dist/dmg-install.log
            C:/Program Files/StepSecurity/state/update.log
            dist/dmg-repair.log
            dist/dmg-upgrade.log
            dist/dmg-uninstall.log
          if-no-files-found: ignore
